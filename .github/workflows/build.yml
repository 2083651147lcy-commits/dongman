name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
      - name: Build
        run: |
          unzip -q local_anime.zip
          cd local_anime
          flutter create --org com.example --project-name local_anime --platforms=android .
          rm -f test/widget_test.dart
          flutter pub get
          flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: local-anime-apk
          path: local_anime/build/app/outputs/flutter-apk/app-release.apk
